<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="sessiondock-mode" content="__SESSIONDOCK_MODE__">
  <meta name="sessiondock-build" content="__SESSIONDOCK_ASSET_VERSION__">
  <title>网格终端 · SessionDock</title>
  <script defer src="capabilities.js?v=__SESSIONDOCK_ASSET_VERSION__"></script>
<script>
  // 在样式表加载前确定明暗，避免刷新时先闪出另一套颜色。
  (() => {
    let choice = 'system';
    let namespace = '';
    try {
      const caps = JSON.parse(document.querySelector('meta[name="sessiondock-capabilities"]')?.content || '{}');
      namespace = typeof caps.storage_namespace === 'string' && caps.storage_namespace
        ? caps.storage_namespace : caps.backend === 'rust' ? 'sessiondock.' : '';
    } catch {}
    const current = document.querySelector('meta[name="sessiondock-mode"]')?.content === 'hub'
      ? `sessiondock.hub.${location.pathname}.` : 'sessiondock.';
    const prefix = namespace || current;
    try {
      const saved = localStorage.getItem(prefix + 'theme');
      choice = JSON.parse(saved) || 'system';
    } catch {}
    document.documentElement.dataset.theme = choice === 'system'
      ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : choice;
  })();
</script>
  <link rel="stylesheet" href="typography.css?v=__SESSIONDOCK_ASSET_VERSION__">
  <script defer src="typography.js?v=__SESSIONDOCK_ASSET_VERSION__"></script>
  <link rel="stylesheet" href="grid.css?v=__SESSIONDOCK_ASSET_VERSION__">
  <script type="module" src="grid.js?v=__SESSIONDOCK_ASSET_VERSION__"></script>
</head>
<body>
  <main>
    <header><div class="app-mark" aria-hidden="true">▰</div><h1>网格终端</h1><span id="machine"></span></header>
    <div class="toolbar">
      <select id="session" aria-label="会话"></select>
      <button id="connect">连接</button>
      <button id="takeover" hidden>抢占</button>
      <span id="status" role="status" aria-live="polite"></span>
      <span id="size"></span>
      <button id="copy">复制选区</button>
      <button id="paste">粘贴</button>
      <button id="bottom">回到底部</button>
    </div>
    <div id="term" tabindex="0">
      <canvas id="grid"></canvas>
      <textarea id="keys" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="终端输入"></textarea>
    </div>
  </main>
</body>
</html>
