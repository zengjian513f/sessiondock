<script>
  // 在样式表加载前确定明暗，避免刷新时先闪出另一套颜色。
  (() => {
    let choice = 'system';
    let namespace = '';
    try {
      const caps = JSON.parse(document.querySelector('meta[name="sessiondock-capabilities"]')?.content || '{}');
      namespace = typeof caps.storage_namespace === 'string' && caps.storage_namespace
        ? caps.storage_namespace : 'sessiondock.';
    } catch {}
    const current = document.querySelector('meta[name="sessiondock-mode"]')?.content === 'hub'
      ? `sessiondock.hub.${location.pathname}.` : 'sessiondock.';
    const prefix = namespace || current;
    try {
      const saved = localStorage.getItem(prefix + 'theme');
      choice = JSON.parse(saved) || 'system';
    } catch {}
    document.documentElement.dataset.theme = choice === 'system'
      ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : choice;
    // 手机刷新时上次停在会话页（或带 ?sid= 深链）就直接从会话页起步，
    // 不先画列表、等列表接口回来再翻到会话页。app.js 恢复不了时再退回列表。
    try {
      const read = key => JSON.parse(localStorage.getItem(prefix + key));
      if (matchMedia('(max-width: 720px)').matches
          && ((new URLSearchParams(location.search).get('sid') || '').trim()
            || (read('mobilePage') === 'detail' && read('sel')))) {
        document.documentElement.dataset.bootPage = 'detail';
      }
    } catch {}
  })();
</script>

<script>
  // 不再注册 Service Worker：同源新标签页的导航要先经过它，而浏览器把它安排在已有的
  // 同站点进程里启动——旧页面主线程卡死时，新标签页跟着挂到 60 s 启动超时。离线壳
  // 缓存不值这个代价。这里把早先装上的注销掉，并清掉它的缓存。
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations()
      .then(list => Promise.all(list.map(item => item.unregister())))
      .catch(() => {});
    if (window.caches) {
      caches.keys().then(keys => Promise.all(keys
        .filter(key => key.startsWith('sessiondock-shell-'))
        .map(key => caches.delete(key)))).catch(() => {});
    }
  }
</script>
