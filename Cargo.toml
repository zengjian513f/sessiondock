[workspace]
members = ["crates/sessiondock", "crates/ptyhost", "crates/ptyhost-client", "crates/ptyhost-record", "crates/ptyhost-screen"]
default-members = ["crates/sessiondock"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = "=2.14.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-util"] }
tower = { version = "0.5", features = ["util"] }
sha1 = "0.10"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std"] }
tempfile = "3"
mime_guess = "2"
async-stream = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }

[profile.release]
strip = true
