# Load in http on the public proxy and the Hub relay. Match the original
# request so an internal auth redirect does not hide the attempted route.
map $request_uri $sessiondock_request_route {
    default                                            "";
    ~^/(?:sessiondock/)?api/messages/[^?]+(?:\?|$)       history;
    ~^/(?:sessiondock/)?api/session/conversation(?:\?|$) draft;
    ~^/(?:sessiondock/)?api/audit/browser(?:\?|$)        browser_audit;
    ~^/(?:sessiondock/)?api/events(?:\?|$)               events;
    ~^/(?:sessiondock/)?api/watch(?:\?|$)                watch;
    ~^/(?:sessiondock/)?api/codex-sdk/events(?:\?|$)     codex_events;
    ~^/(?:sessiondock/)?api/native-sdk/events(?:\?|$)    native_events;
}

map $http_x_sessiondock_trace $sessiondock_request_trace {
    default "";
    "~^[0-9a-fA-F-]{32,36}$" $http_x_sessiondock_trace;
}

map $http_x_sessiondock_page $sessiondock_request_page {
    default "";
    "~^[0-9a-fA-F-]{32,36}$" $http_x_sessiondock_page;
}

# The public listener's socket endpoint joins a request to kernel TCP events.
map $server_port $sessiondock_tcp_peer {
    default "";
    443 "[$realip_remote_addr]:$realip_remote_port";
}

# Subtract request_time from finished_at for the request start (epoch seconds).
# Upstream timings and status may list several attempts or "-" if unavailable.
log_format sessiondock_request escape=json
    '{"finished_at":$msec,"request_time":$request_time,'
    '"pid":$pid,"connection":$connection,"connection_requests":$connection_requests,'
    '"tcp_peer":"$sessiondock_tcp_peer",'
    '"protocol":"$server_protocol","method":"$request_method",'
    '"route":"$sessiondock_request_route","status":$status,"completion":"$request_completion",'
    '"page":"$sessiondock_request_page","trace":"$sessiondock_request_trace",'
    '"upstream_status":"$upstream_status","upstream_connect_time":"$upstream_connect_time",'
    '"upstream_header_time":"$upstream_header_time","upstream_response_time":"$upstream_response_time"}';
