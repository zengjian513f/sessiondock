# Replace <PREVIEW_PATH> (without trailing slash) and <HUB_PORT>.
# Include inside the existing authenticated HTTPS server. Both assets and API
# use this Hub: its page build must match /api/meta and the send handlers.
location = <PREVIEW_PATH> { return 301 <PREVIEW_PATH>/; }

location ^~ <PREVIEW_PATH>/ {
    include snippets/auth.conf;
    proxy_pass http://127.0.0.1:<HUB_PORT>/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 512m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/javascript text/javascript text/css application/json
               application/manifest+json image/svg+xml font/ttf font/otf;
}
