name: Scoped validation

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run complete release acceptance
        type: boolean
        default: false
      collector:
        description: Also validate the optional Linux collector
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      browser: ${{ steps.scope.outputs.browser }}
      collector: ${{ steps.scope.outputs.collector }}
      platforms: ${{ steps.scope.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: scope
        run: python3 deploy/ci_plan.py
      - uses: actions/upload-artifact@v4
        with:
          name: ci-plan
          path: ci-plan.json

  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tests/check_docs_links.py
      - run: python3 tests/check_agents_md.py
      - run: python3 tests/brand_names_check.py
      - run: python3 deploy/check.py

  rust:
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.platforms) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Collector build prerequisites
        if: runner.os == 'Linux' && needs.plan.outputs.collector == 'true'
        run: sudo apt-get update && sudo apt-get install -y clang-18 linux-libc-dev
      - run: python deploy/ci_plan.py --run rust

  browser:
    needs: plan
    if: needs.plan.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
      - name: Chromium
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - run: python3 deploy/ci_plan.py --run browser
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs
          path: target/validation/
          retention-days: 14
