# Compile and lint on Linux, Windows and macOS; doc checks and a headless
# Chromium smoke run on Linux; a reproducible Linux package on version tags.
# The toolchain is pinned to the development machines' rustc (1.98.1) so CI
# and the reproducible package match them. See docs/release.md.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: clang for the resource-agent BPF object
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang-18
      - name: fmt
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: build
        run: cargo build --release --workspace --locked

  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tests/check_docs_links.py
      - run: python3 tests/check_agents_md.py
      - run: python3 tests/brand_names_check.py
      - run: python3 tests/env_reference.py --check

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: debug and release binaries
        run: |
          cargo build --locked -p sessiondock -p ptyhost
          cargo build --release --locked -p sessiondock -p ptyhost
      - name: Playwright Chromium
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: browser smoke suites
        run: >-
          python3 tests/run_validation.py --keep-going --browser-jobs 2
          --only legacy_browser,server_log_browser,terminal_final_screen_browser,history_browser
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs
          path: target/validation/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, checks, browser]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - name: reproducible package
        run: python3 deploy/release.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: target/release-packages/*.tar.gz*
