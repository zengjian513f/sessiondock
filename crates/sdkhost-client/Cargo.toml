[package]
name = "sdkhost-client"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
flate2 = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tokio = { version = "1", features = ["net", "io-util", "time", "process", "fs", "sync", "rt"] }
