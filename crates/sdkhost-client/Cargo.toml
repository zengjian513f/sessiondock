[package]
name = "sdkhost-client"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
flate2 = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tokio = { version = "1", features = ["net", "io-util", "time", "process", "fs", "sync", "rt"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_Memory"] }
