[package]
name = "ptyhost-client"
version = "0.1.0"
edition = "2024"
publish = false
description = "Isolated asynchronous client for the local ptyhost protocol"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "io-util", "time", "fs", "sync"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
