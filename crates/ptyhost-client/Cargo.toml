[package]
name = "ptyhost-client"
version = "0.1.0"
edition = "2024"
publish = false
description = "Isolated asynchronous client for the local ptyhost protocol"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "io-util", "time", "fs", "sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Boot session uuid and libproc liveness where there is no /proc.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock", "Win32_System_IO"] }
