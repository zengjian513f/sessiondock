[package]
name = "sdkhost"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
sdkhost-client = { path = "../sdkhost-client" }
serde_json = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
libc = "0.2"
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "io-std", "process", "fs", "sync", "signal", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security"] }
